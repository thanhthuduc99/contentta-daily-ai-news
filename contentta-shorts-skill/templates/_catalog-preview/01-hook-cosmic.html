<!doctype html>
<!--
  01 — HOOK (cosmic) | use-case: scene mở đầu, câu hook
  KEYWORDS: orbital rings dim · particle drift · word slam from above · solar flare punch
            · karaoke caption · fast multi-beat · whip exit | 1080×1920 dọc
-->
<html lang="vi"><head><meta charset="UTF-8"/>
<title>01 · Hook Cosmic</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100vw;height:100vh;overflow:hidden;background:#000;color:#FAF7F5;display:flex;align-items:center;justify-content:center;font-family:"Plus Jakarta Sans",sans-serif}
  .stage{width:1080px;height:1920px;position:relative;overflow:hidden;transform-origin:center;background:#070409;flex:0 0 auto}
  .nebula{position:absolute;inset:-200px;background:radial-gradient(ellipse 55% 40% at 50% 28%,rgba(225,14,31,0.20),rgba(90,4,16,0.12) 38%,transparent 70%),radial-gradient(ellipse 70% 50% at 50% 22%,#160812,#0c0510 55%,#070409 90%)}
  .orbit{position:absolute;top:540px;left:50%;border-radius:50%;transform-origin:center}
  .o1{width:1000px;height:1000px;margin:-500px 0 0 -500px;border:1.5px solid rgba(225,14,31,0.38)}
  .o2{width:680px;height:680px;margin:-340px 0 0 -340px;border:1px solid rgba(250,247,245,0.13)}
  .o3{width:420px;height:420px;margin:-210px 0 0 -210px;border:1.5px solid rgba(225,14,31,0.26)}
  .particles{position:absolute;inset:0;pointer-events:none}
  .dot{position:absolute;border-radius:50%;background:#FAF7F5;box-shadow:0 0 9px rgba(225,14,31,0.7);opacity:0.55}
  .dot.red{background:#E10E1F;box-shadow:0 0 12px rgba(225,14,31,0.9)}
  .flare{position:absolute;top:540px;left:50%;width:900px;height:900px;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle,rgba(225,14,31,0.5),rgba(225,14,31,0.15) 32%,transparent 60%);opacity:0;mix-blend-mode:screen}
  .chip{position:absolute;top:300px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:10px;padding:9px 20px;border:1.5px solid rgba(225,14,31,0.6);background:rgba(7,4,9,0.7);border-radius:999px;font-weight:600;font-size:20px;letter-spacing:0.22em;white-space:nowrap;opacity:0}
  .chip i{width:9px;height:9px;border-radius:50%;background:#E10E1F;box-shadow:0 0 12px rgba(225,14,31,0.9)}
  .headline{position:absolute;top:430px;left:0;right:0;text-align:center;font-family:"Be Vietnam Pro",sans-serif;font-weight:800;font-size:104px;letter-spacing:-0.03em;line-height:0.98;padding:0 80px;text-shadow:0 4px 0 #070409,0 0 44px rgba(225,14,31,0.35)}
  .headline .w{display:inline-block;opacity:0;transform:translateY(-120px) rotate(-7deg);filter:blur(16px)}
  .headline .w.a{color:#E10E1F}
  .sub{position:absolute;top:700px;left:0;right:0;text-align:center;font-weight:600;font-size:30px;color:#A89BA1;padding:0 110px;opacity:0}
  .caption{position:absolute;bottom:300px;left:0;right:0;text-align:center;padding:0 70px;font-family:"Be Vietnam Pro",sans-serif;font-weight:700;font-size:52px;line-height:1.16;letter-spacing:-0.01em}
  .caption .cw{display:inline-block;color:rgba(250,247,245,0.45);text-shadow:-2px -2px 0 #070409,2px -2px 0 #070409,-2px 2px 0 #070409,2px 2px 0 #070409,0 5px 12px rgba(0,0,0,0.6)}
  .face{position:absolute;bottom:0;left:0;right:0;height:200px;background:linear-gradient(0deg,rgba(225,14,31,0.06),transparent);border-top:1px solid rgba(225,14,31,0.25)}
  .face::after{content:"▮ VÙNG MẶT NGƯỜI";position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:15px;letter-spacing:0.4em;color:rgba(168,155,161,0.5)}
</style></head><body>
<div class="stage" id="stage">
  <div class="nebula"></div>
  <div class="orbit o1" id="o1"></div><div class="orbit o2" id="o2"></div><div class="orbit o3" id="o3"></div>
  <div class="particles" id="p"></div>
  <div class="flare" id="flare"></div>
  <div class="chip" id="chip"><i></i><span>AI AGENCY · CONTENTTA</span></div>
  <div class="headline" id="h"><span class="w a">AI</span> <span class="w">LÀM</span><br/><span class="w">THAY</span> <span class="w">ANH</span></div>
  <div class="sub" id="sub">90% việc lặp lại để agent lo</div>
  <div class="caption" id="cap"><span class="cw">Để</span> <span class="cw">agent</span> <span class="cw">lo</span> <span class="cw">phần</span> <span class="cw">việc</span> <span class="cw">lặp</span> <span class="cw">lại</span></div>
  <div class="face"></div>
</div>
<script>
function fit(){document.getElementById('stage').style.transform='scale('+Math.min(innerWidth/1080,innerHeight/1920)+')'}
addEventListener('resize',fit);fit();
const p=document.getElementById('p');
for(let i=0;i<26;i++){const a=i*0.81,r=120+(i%5)*68,x=540+Math.cos(a)*r,y=540+Math.sin(a)*r*0.78;const d=document.createElement('div');d.className=i%5===0?'dot red':'dot';d.style.left=x+'px';d.style.top=y+'px';const s=3+(i%3);d.style.width=s+'px';d.style.height=s+'px';p.appendChild(d)}
gsap.to('#o1',{rotation:360,duration:26,ease:'none',repeat:-1});
gsap.to('#o2',{rotation:-360,duration:17,ease:'none',repeat:-1});
gsap.to('#o3',{rotation:360,duration:11,ease:'none',repeat:-1});
gsap.utils.toArray('.dot').forEach((d,i)=>gsap.to(d,{x:Math.cos(i)*14,y:Math.sin(i)*14,duration:3+(i%4),yoyo:true,repeat:-1,ease:'sine.inOut'}));
const cw=gsap.utils.toArray('#cap .cw');
const tl=gsap.timeline({repeat:-1,repeatDelay:0.4});
tl.to('#chip',{opacity:1,duration:0.22,ease:'power2.out'},0)
  .to('.headline .w',{opacity:1,y:0,rotation:0,filter:'blur(0px)',duration:0.34,ease:'back.out(1.7)',stagger:0.09},0.18)
  .to('.headline .w',{x:5,duration:0.04,yoyo:true,repeat:3,ease:'power1.inOut'},0.62)
  .to('#flare',{opacity:1,scale:1,duration:0.30,ease:'power3.out'},0.50)
  .to('#flare',{opacity:0,duration:0.45,ease:'power2.in'},0.78)
  .to('#sub',{opacity:1,duration:0.28,ease:'power2.out'},0.80);
cw.forEach((w,i)=>tl.to(w,{color:'#FAF7F5',duration:0.10,ease:'power2.out'},1.05+i*0.12));
tl.to(['.headline','#chip','#sub'],{y:'-=70',opacity:0,filter:'blur(14px)',duration:0.28,ease:'power2.in'},2.55)
  .to('#cap',{opacity:0,duration:0.22,ease:'power2.in'},2.6)
  .set('.headline .w',{opacity:0,y:-120,rotation:-7,filter:'blur(16px)'},3.0)
  .set(['.headline','#sub'],{y:0,opacity:0,filter:'blur(0px)'},3.0)
  .set('#chip',{y:0,opacity:0},3.0).set('#cap',{opacity:1},3.0)
  .set(cw,{color:'rgba(250,247,245,0.45)'},3.0);
</script></body></html>
