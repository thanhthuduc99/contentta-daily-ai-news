<!doctype html>
<!--
  02 — BIG NUMBER (cosmic) | use-case: nhấn 1 con số / thống kê
  KEYWORDS: giant number pop · particle burst converge · orbital halo · tremor
            · counter feel · karaoke caption · whip exit | 1080×1920 dọc
-->
<html lang="vi"><head><meta charset="UTF-8"/>
<title>02 · Big Number Cosmic</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100vw;height:100vh;overflow:hidden;background:#000;color:#FAF7F5;display:flex;align-items:center;justify-content:center;font-family:"Plus Jakarta Sans",sans-serif}
  .stage{width:1080px;height:1920px;position:relative;overflow:hidden;transform-origin:center;background:#070409;flex:0 0 auto}
  .nebula{position:absolute;inset:-200px;background:radial-gradient(ellipse 60% 45% at 50% 30%,rgba(225,14,31,0.22),rgba(90,4,16,0.12) 38%,transparent 70%),radial-gradient(ellipse 70% 50% at 50% 26%,#160812,#0c0510 55%,#070409 90%)}
  .halo{position:absolute;top:560px;left:50%;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;border:1.5px solid rgba(225,14,31,0.30);box-shadow:0 0 60px rgba(225,14,31,0.15) inset}
  .particles{position:absolute;inset:0;pointer-events:none}
  .dot{position:absolute;border-radius:50%;background:#FAF7F5;box-shadow:0 0 9px rgba(225,14,31,0.7);opacity:0.5}
  .dot.red{background:#E10E1F;box-shadow:0 0 12px rgba(225,14,31,0.9)}
  .chip{position:absolute;top:320px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:10px;padding:9px 20px;border:1.5px solid rgba(225,14,31,0.6);background:rgba(7,4,9,0.7);border-radius:999px;font-weight:600;font-size:20px;letter-spacing:0.22em;white-space:nowrap;opacity:0}
  .chip i{width:9px;height:9px;border-radius:50%;background:#E10E1F;box-shadow:0 0 12px rgba(225,14,31,0.9)}
  .big{position:absolute;top:560px;left:0;right:0;text-align:center;font-family:"Be Vietnam Pro",sans-serif;font-weight:800;font-size:420px;line-height:0.8;color:#E10E1F;letter-spacing:-0.04em;text-shadow:0 0 80px rgba(225,14,31,0.5),0 8px 0 #070409;opacity:0;transform:scale(0.4)}
  .label{position:absolute;top:980px;left:0;right:0;text-align:center;font-family:"Be Vietnam Pro",sans-serif;font-weight:700;font-size:64px;letter-spacing:0.02em;color:#FAF7F5;opacity:0}
  .sub{position:absolute;top:1080px;left:0;right:0;text-align:center;font-weight:600;font-size:30px;color:#A89BA1;opacity:0}
  .caption{position:absolute;bottom:300px;left:0;right:0;text-align:center;padding:0 70px;font-family:"Be Vietnam Pro",sans-serif;font-weight:700;font-size:52px;line-height:1.16;letter-spacing:-0.01em}
  .caption .cw{display:inline-block;color:rgba(250,247,245,0.45);text-shadow:-2px -2px 0 #070409,2px -2px 0 #070409,-2px 2px 0 #070409,2px 2px 0 #070409,0 5px 12px rgba(0,0,0,0.6)}
  .face{position:absolute;bottom:0;left:0;right:0;height:200px;background:linear-gradient(0deg,rgba(225,14,31,0.06),transparent);border-top:1px solid rgba(225,14,31,0.25)}
  .face::after{content:"▮ VÙNG MẶT NGƯỜI";position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:15px;letter-spacing:0.4em;color:rgba(168,155,161,0.5)}
</style></head><body>
<div class="stage" id="stage">
  <div class="nebula"></div><div class="halo" id="halo"></div>
  <div class="particles" id="p"></div>
  <div class="chip" id="chip"><i></i><span>HIỆU SUẤT · CONTENTTA</span></div>
  <div class="big" id="big">3×</div>
  <div class="label" id="label">NHANH HƠN</div>
  <div class="sub" id="sub">so với làm thủ công</div>
  <div class="caption" id="cap"><span class="cw">Đội</span> <span class="cw">ngũ</span> <span class="cw">AI</span> <span class="cw">chạy</span> <span class="cw">nhanh</span> <span class="cw">gấp</span> <span class="cw">ba</span> <span class="cw">lần</span></div>
  <div class="face"></div>
</div>
<script>
function fit(){document.getElementById('stage').style.transform='scale('+Math.min(innerWidth/1080,innerHeight/1920)+')'}
addEventListener('resize',fit);fit();
const p=document.getElementById('p');
for(let i=0;i<30;i++){const a=i*0.83,r=120+(i%6)*60,x=540+Math.cos(a)*r,y=560+Math.sin(a)*r*0.9;const d=document.createElement('div');d.className=i%4===0?'dot red':'dot';d.dataset.x=x;d.dataset.y=y;d.style.left=x+'px';d.style.top=y+'px';const s=3+(i%3);d.style.width=s+'px';d.style.height=s+'px';p.appendChild(d)}
gsap.to('#halo',{rotation:360,duration:24,ease:'none',repeat:-1,transformOrigin:'50% 50%'});
const cw=gsap.utils.toArray('#cap .cw');
const tl=gsap.timeline({repeat:-1,repeatDelay:0.4});
// particles converge toward center as number pops
tl.to('#chip',{opacity:1,duration:0.22,ease:'power2.out'},0)
  .to('.dot',{x:(i,t)=>540-parseFloat(t.dataset.x),y:(i,t)=>560-parseFloat(t.dataset.y),scale:1.5,duration:0.4,ease:'power2.in',stagger:0.004},0.30)
  .to('#big',{opacity:1,scale:1,duration:0.42,ease:'back.out(1.8)'},0.62)
  .to('#big',{x:6,duration:0.04,yoyo:true,repeat:4,ease:'power1.inOut'},1.02)
  .to('.dot',{x:0,y:0,scale:1,duration:0.8,ease:'power3.out',stagger:0.004},0.72)
  .to('#label',{opacity:1,duration:0.28,ease:'power2.out'},0.95)
  .to('#sub',{opacity:1,duration:0.26,ease:'power2.out'},1.12);
cw.forEach((w,i)=>tl.to(w,{color:'#FAF7F5',duration:0.10,ease:'power2.out'},1.20+i*0.11));
tl.to(['#big','#label','#sub','#chip'],{y:'-=60',opacity:0,filter:'blur(14px)',duration:0.28,ease:'power2.in'},2.6)
  .to('#cap',{opacity:0,duration:0.22,ease:'power2.in'},2.65)
  .set('#big',{opacity:0,scale:0.4,y:0,filter:'blur(0px)'},3.05)
  .set(['#label','#sub'],{y:0,opacity:0,filter:'blur(0px)'},3.05)
  .set('#chip',{y:0,opacity:0},3.05).set('#cap',{opacity:1},3.05)
  .set(cw,{color:'rgba(250,247,245,0.45)'},3.05);
</script></body></html>
