<!doctype html>
<!--
  05 — CTA (supernova) | use-case: kêu gọi theo dõi / hành động cuối
  KEYWORDS: supernova radial burst · CTA pill glow · arrow nudge loop · ring shockwave
            · karaoke caption · whip exit | 1080×1920 dọc
-->
<html lang="vi"><head><meta charset="UTF-8"/>
<title>05 · CTA Supernova</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100vw;height:100vh;overflow:hidden;background:#000;color:#FAF7F5;display:flex;align-items:center;justify-content:center;font-family:"Plus Jakarta Sans",sans-serif}
  .stage{width:1080px;height:1920px;position:relative;overflow:hidden;transform-origin:center;background:#070409;flex:0 0 auto}
  .nebula{position:absolute;inset:-200px;background:radial-gradient(ellipse 60% 45% at 50% 40%,rgba(225,14,31,0.22),rgba(90,4,16,0.12) 38%,transparent 70%),radial-gradient(ellipse 70% 50% at 50% 38%,#160812,#0c0510 55%,#070409 90%)}
  .burst{position:absolute;top:640px;left:50%;width:1000px;height:1000px;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle,rgba(225,14,31,0.55),rgba(225,14,31,0.18) 30%,transparent 60%);opacity:0;mix-blend-mode:screen}
  .ring{position:absolute;top:640px;left:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:2px solid rgba(225,14,31,0.6);opacity:0}
  .headline{position:absolute;top:480px;left:0;right:0;text-align:center;font-family:"Be Vietnam Pro",sans-serif;font-weight:800;font-size:104px;letter-spacing:-0.03em;line-height:0.98;text-shadow:0 4px 0 #070409,0 0 44px rgba(225,14,31,0.4)}
  .headline .w{display:inline-block;opacity:0;transform:translateY(-100px) rotate(-6deg);filter:blur(14px)}
  .headline .w.a{color:#E10E1F}
  .pill{position:absolute;top:720px;left:50%;transform:translateX(-50%) scale(0.6);display:inline-flex;align-items:center;gap:16px;padding:26px 52px;border-radius:999px;background:#E10E1F;font-family:"Be Vietnam Pro",sans-serif;font-weight:700;font-size:46px;color:#FAF7F5;box-shadow:0 0 50px rgba(225,14,31,0.6);opacity:0;white-space:nowrap}
  .pill svg{width:40px;height:40px}
  .caption{position:absolute;bottom:300px;left:0;right:0;text-align:center;padding:0 70px;font-family:"Be Vietnam Pro",sans-serif;font-weight:700;font-size:52px;line-height:1.16;letter-spacing:-0.01em}
  .caption .cw{display:inline-block;color:rgba(250,247,245,0.45);text-shadow:-2px -2px 0 #070409,2px -2px 0 #070409,-2px 2px 0 #070409,2px 2px 0 #070409,0 5px 12px rgba(0,0,0,0.6)}
  .face{position:absolute;bottom:0;left:0;right:0;height:200px;background:linear-gradient(0deg,rgba(225,14,31,0.06),transparent);border-top:1px solid rgba(225,14,31,0.25)}
  .face::after{content:"▮ VÙNG MẶT NGƯỜI";position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:15px;letter-spacing:0.4em;color:rgba(168,155,161,0.5)}
</style></head><body>
<div class="stage" id="stage">
  <div class="nebula"></div>
  <div class="burst" id="burst"></div>
  <div class="ring" id="ring"></div>
  <div class="headline" id="h"><span class="w">THEO</span> <span class="w a">DÕI</span></div>
  <div class="pill" id="pill"><svg viewBox="0 0 24 24" fill="none" stroke="#FAF7F5" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg><span>Học build AI agent</span></div>
  <div class="caption" id="cap"><span class="cw">Theo</span> <span class="cw">dõi</span> <span class="cw">Contentta</span> <span class="cw">để</span> <span class="cw">học</span> <span class="cw">miễn</span> <span class="cw">phí</span></div>
  <div class="face"></div>
</div>
<script>
function fit(){document.getElementById('stage').style.transform='scale('+Math.min(innerWidth/1080,innerHeight/1920)+')'}
addEventListener('resize',fit);fit();
const cw=gsap.utils.toArray('#cap .cw');
const tl=gsap.timeline({repeat:-1,repeatDelay:0.4});
tl.to('.headline .w',{opacity:1,y:0,rotation:0,filter:'blur(0px)',duration:0.34,ease:'back.out(1.7)',stagger:0.10},0.15)
  .to('#burst',{opacity:1,scale:1,duration:0.34,ease:'power3.out'},0.55)
  .to('#burst',{opacity:0,duration:0.5,ease:'power2.in'},0.85)
  .fromTo('#ring',{scale:0.3,opacity:0.9},{scale:2.4,opacity:0,duration:0.7,ease:'power2.out'},0.58)
  .to('#pill',{opacity:1,scale:1,duration:0.40,ease:'back.out(1.9)'},0.75);
// arrow/pill nudge loop
gsap.to('#pill svg',{x:8,duration:0.6,yoyo:true,repeat:-1,ease:'sine.inOut'});
cw.forEach((w,i)=>tl.to(w,{color:'#FAF7F5',duration:0.10,ease:'power2.out'},1.15+i*0.12));
tl.to(['.headline','#pill'],{y:'-=60',opacity:0,filter:'blur(14px)',duration:0.28,ease:'power2.in'},2.6)
  .to('#cap',{opacity:0,duration:0.22,ease:'power2.in'},2.65)
  .set('.headline .w',{opacity:0,y:-100,rotation:-6,filter:'blur(14px)'},3.05)
  .set('.headline',{y:0,opacity:1,filter:'blur(0px)'},3.05)
  .set('#pill',{opacity:0,scale:0.6,y:0,filter:'blur(0px)'},3.05)
  .set('#cap',{opacity:1},3.05).set(cw,{color:'rgba(250,247,245,0.45)'},3.05);
</script></body></html>
