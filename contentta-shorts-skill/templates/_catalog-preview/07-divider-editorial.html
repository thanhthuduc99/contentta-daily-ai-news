<!doctype html>
<!--
  07 — DIVIDER CHƯƠNG (editorial) | use-case: chuyển phần / mở chương mới
  KEYWORDS: chapter number stroke · hairline draw both sides · serif title slam
            · small-caps tag · karaoke caption · whip exit | 1080×1920 dọc
-->
<html lang="vi"><head><meta charset="UTF-8"/>
<title>07 · Divider Editorial</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Be+Vietnam+Pro:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100vw;height:100vh;overflow:hidden;background:#000;color:#FAF7F5;display:flex;align-items:center;justify-content:center;font-family:"Be Vietnam Pro",sans-serif}
  .stage{width:1080px;height:1920px;position:relative;overflow:hidden;transform-origin:center;background:#070409;flex:0 0 auto}
  .halo{position:absolute;inset:0;background:radial-gradient(ellipse 55% 35% at 50% 34%,rgba(90,4,16,0.32),transparent 60%)}
  .tag{position:absolute;top:430px;left:0;right:0;text-align:center;font-family:"JetBrains Mono",monospace;font-size:22px;letter-spacing:0.5em;color:#A89BA1;text-transform:uppercase;opacity:0}
  .tag .a{color:#E10E1F}
  .big{position:absolute;top:480px;left:0;right:0;text-align:center;font-family:"Playfair Display",serif;font-style:italic;font-weight:700;font-size:300px;line-height:0.8;color:transparent;-webkit-text-stroke:2px rgba(225,14,31,0.5);opacity:0;transform:scale(0.9) rotate(-3deg)}
  .title{position:absolute;top:880px;left:0;right:0;text-align:center;font-family:"Playfair Display",serif;font-style:italic;font-weight:700;font-size:96px;letter-spacing:-0.02em;color:#FAF7F5;opacity:0;transform:translateY(28px)}
  .dvl{position:absolute;top:1010px;left:160px;width:240px;height:1px;background:#E10E1F;transform-origin:right;transform:scaleX(0)}
  .dvr{position:absolute;top:1010px;right:160px;width:240px;height:1px;background:#E10E1F;transform-origin:left;transform:scaleX(0)}
  .caption{position:absolute;bottom:300px;left:0;right:0;text-align:center;padding:0 70px;font-family:"Be Vietnam Pro",sans-serif;font-weight:800;font-size:52px;line-height:1.16;letter-spacing:-0.01em}
  .caption .cw{display:inline-block;color:rgba(250,247,245,0.45);text-shadow:-2px -2px 0 #070409,2px -2px 0 #070409,-2px 2px 0 #070409,2px 2px 0 #070409,0 5px 12px rgba(0,0,0,0.6)}
  .face{position:absolute;bottom:0;left:0;right:0;height:200px;background:linear-gradient(0deg,rgba(225,14,31,0.06),transparent);border-top:1px solid rgba(225,14,31,0.25)}
  .face::after{content:"▮ VÙNG MẶT NGƯỜI";position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:15px;letter-spacing:0.4em;color:rgba(168,155,161,0.5)}
</style></head><body>
<div class="stage" id="stage">
  <div class="halo"></div>
  <div class="tag" id="tag">CHƯƠNG <span class="a">·</span> HAI</div>
  <div class="big" id="big">02</div>
  <div class="title" id="title">Tự động hoá</div>
  <div class="dvl" id="dvl"></div><div class="dvr" id="dvr"></div>
  <div class="caption" id="cap"><span class="cw">Phần</span> <span class="cw">hai</span> <span class="cw">tự</span> <span class="cw">động</span> <span class="cw">hoá</span> <span class="cw">toàn</span> <span class="cw">bộ</span></div>
  <div class="face"></div>
</div>
<script>
function fit(){document.getElementById('stage').style.transform='scale('+Math.min(innerWidth/1080,innerHeight/1920)+')'}
addEventListener('resize',fit);fit();
const cw=gsap.utils.toArray('#cap .cw');
const tl=gsap.timeline({repeat:-1,repeatDelay:0.4});
tl.to('#tag',{opacity:1,duration:0.28,ease:'power2.out'},0)
  .to('#big',{opacity:1,scale:1,rotation:0,duration:0.5,ease:'back.out(1.4)'},0.20)
  .to('#title',{opacity:1,y:0,duration:0.40,ease:'power3.out'},0.55)
  .to('#dvl',{scaleX:1,duration:0.36,ease:'power3.out'},0.78)
  .to('#dvr',{scaleX:1,duration:0.36,ease:'power3.out'},0.78);
cw.forEach((w,i)=>tl.to(w,{color:'#FAF7F5',duration:0.10,ease:'power2.out'},1.05+i*0.13));
tl.to(['#big','#title','#tag'],{y:'-=55',opacity:0,filter:'blur(12px)',duration:0.26,ease:'power2.in'},2.6)
  .to(['#cap','#dvl','#dvr'],{opacity:0,duration:0.22,ease:'power2.in'},2.65)
  .set('#big',{opacity:0,scale:0.9,rotation:-3,y:0,filter:'blur(0px)'},3.05)
  .set('#title',{opacity:0,y:28,filter:'blur(0px)'},3.05)
  .set('#tag',{opacity:0,y:0,filter:'blur(0px)'},3.05)
  .set(['#dvl','#dvr'],{scaleX:0,opacity:1},3.05)
  .set('#cap',{opacity:1},3.05).set(cw,{color:'rgba(250,247,245,0.45)'},3.05);
</script></body></html>
