<!doctype html>
<!--
  09 — STAT CALLOUT (editorial) | use-case: nhấn 1 chỉ số dạng tạp chí
  KEYWORDS: oversized serif percent · index label · hairline frame · count-up tween
            · footnote mono · karaoke caption · whip exit | 1080×1920 dọc
-->
<html lang="vi"><head><meta charset="UTF-8"/>
<title>09 · Stat Editorial</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Be+Vietnam+Pro:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100vw;height:100vh;overflow:hidden;background:#000;color:#FAF7F5;display:flex;align-items:center;justify-content:center;font-family:"Be Vietnam Pro",sans-serif}
  .stage{width:1080px;height:1920px;position:relative;overflow:hidden;transform-origin:center;background:#070409;flex:0 0 auto}
  .halo{position:absolute;inset:0;background:radial-gradient(ellipse 55% 38% at 50% 32%,rgba(90,4,16,0.30),transparent 60%)}
  .head{position:absolute;top:300px;left:110px;right:110px;display:flex;justify-content:space-between;align-items:center;font-family:"JetBrains Mono",monospace;font-size:18px;letter-spacing:0.3em;color:#A89BA1;text-transform:uppercase;opacity:0}
  .head .a{color:#E10E1F}
  .dvt{position:absolute;top:355px;left:110px;right:110px;height:1px;background:#E10E1F;transform-origin:left;transform:scaleX(0)}
  .stat{position:absolute;top:460px;left:0;right:0;text-align:center;font-family:"Playfair Display",serif;font-style:italic;font-weight:700;font-size:340px;line-height:0.85;color:#E10E1F;text-shadow:0 0 70px rgba(225,14,31,0.4);opacity:0;transform:translateY(40px)}
  .label{position:absolute;top:880px;left:0;right:0;text-align:center;font-family:"Playfair Display",serif;font-style:italic;font-weight:700;font-size:72px;color:#FAF7F5;opacity:0}
  .foot{position:absolute;top:1000px;left:0;right:0;text-align:center;font-family:"JetBrains Mono",monospace;font-size:24px;letter-spacing:0.1em;color:#A89BA1;opacity:0}
  .caption{position:absolute;bottom:300px;left:0;right:0;text-align:center;padding:0 70px;font-family:"Be Vietnam Pro",sans-serif;font-weight:800;font-size:50px;line-height:1.16;letter-spacing:-0.01em}
  .caption .cw{display:inline-block;color:rgba(250,247,245,0.45);text-shadow:-2px -2px 0 #070409,2px -2px 0 #070409,-2px 2px 0 #070409,2px 2px 0 #070409,0 5px 12px rgba(0,0,0,0.6)}
  .face{position:absolute;bottom:0;left:0;right:0;height:200px;background:linear-gradient(0deg,rgba(225,14,31,0.06),transparent);border-top:1px solid rgba(225,14,31,0.25)}
  .face::after{content:"▮ VÙNG MẶT NGƯỜI";position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:15px;letter-spacing:0.4em;color:rgba(168,155,161,0.5)}
</style></head><body>
<div class="stage" id="stage">
  <div class="halo"></div>
  <div class="head" id="head"><span>CHỈ SỐ <span class="a">·</span> 01</span><span>CONTENTTA <span class="a">·</span> 2026</span></div>
  <div class="dvt" id="dvt"></div>
  <div class="stat" id="stat">0%</div>
  <div class="label" id="label">chi phí tiết kiệm</div>
  <div class="foot" id="foot">trung bình trên 20 doanh nghiệp</div>
  <div class="caption" id="cap"><span class="cw">Doanh</span> <span class="cw">nghiệp</span> <span class="cw">tiết</span> <span class="cw">kiệm</span> <span class="cw">gần</span> <span class="cw">nửa</span> <span class="cw">chi</span> <span class="cw">phí</span></div>
  <div class="face"></div>
</div>
<script>
function fit(){document.getElementById('stage').style.transform='scale('+Math.min(innerWidth/1080,innerHeight/1920)+')'}
addEventListener('resize',fit);fit();
const statEl=document.getElementById('stat');
const cw=gsap.utils.toArray('#cap .cw');
const counter={v:0};
const tl=gsap.timeline({repeat:-1,repeatDelay:0.4});
tl.to('#head',{opacity:1,duration:0.26,ease:'power2.out'},0)
  .to('#dvt',{scaleX:1,duration:0.40,ease:'power3.out'},0.06)
  .to('#stat',{opacity:1,y:0,duration:0.40,ease:'power3.out'},0.30)
  .to(counter,{v:47,duration:0.9,ease:'power2.out',onUpdate:()=>{statEl.textContent=Math.round(counter.v)+'%'}},0.34)
  .to('#label',{opacity:1,duration:0.30,ease:'power2.out'},1.0)
  .to('#foot',{opacity:1,duration:0.28,ease:'power2.out'},1.18);
cw.forEach((w,i)=>tl.to(w,{color:'#FAF7F5',duration:0.10,ease:'power2.out'},1.30+i*0.11));
tl.to(['#stat','#label','#foot','#head'],{y:'-=55',opacity:0,filter:'blur(12px)',duration:0.26,ease:'power2.in'},2.7)
  .to(['#cap','#dvt'],{opacity:0,duration:0.22,ease:'power2.in'},2.75)
  .set('#stat',{opacity:0,y:40,filter:'blur(0px)'},3.15)
  .set(counter,{v:0},3.15).call(()=>{statEl.textContent='0%'},[],3.15)
  .set(['#label','#foot'],{opacity:0,y:0,filter:'blur(0px)'},3.15)
  .set('#head',{opacity:0,y:0,filter:'blur(0px)'},3.15).set('#dvt',{scaleX:0,opacity:1},3.15)
  .set('#cap',{opacity:1},3.15).set(cw,{color:'rgba(250,247,245,0.45)'},3.15);
</script></body></html>
