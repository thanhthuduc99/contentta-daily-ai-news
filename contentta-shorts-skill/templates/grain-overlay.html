<template id="grain-overlay-template">
  <div
    data-composition-id="grain-overlay"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="16"
  >
    <div class="grn-root"></div>

    <style>
      [data-composition-id="grain-overlay"] {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      [data-composition-id="grain-overlay"] .grn-root {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(rgba(0, 0, 0, 0.12) 1px, transparent 1px) 0 0 / 3px 3px,
          radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px) 2px 1px / 5px 5px;
        mix-blend-mode: overlay;
        opacity: 0.55;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        tl.set({}, {}, 16);
        window.__timelines = window.__timelines || {};
        window.__timelines["grain-overlay"] = tl;
      })();
    </script>
  </div>
</template>
