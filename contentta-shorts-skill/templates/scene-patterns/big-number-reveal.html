<template id="scene4-bignumber-template">
  <div
    data-composition-id="scene4-bignumber"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="4"
  >
    <div class="s4-whip-wrap">
      <div class="s4-scan" id="s4-scan"></div>

      <div class="s4-preamble" id="s4-strip">
        <span id="s4-strip-text"></span>
        <span class="s4-strip-caret" id="s4-strip-caret">▊</span>
      </div>

      <div class="s4-six" id="s4-six">6</div>

      <div class="s4-pill" id="s4-pill">AGENT WORK THẬT SỰ CHO TEAM</div>

      <div class="s4-sub" id="s4-sub">
        — và đây là <span class="s4-sub-emph">production scale</span>
      </div>
    </div>

    <style>
      [data-composition-id="scene4-bignumber"] {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      [data-composition-id="scene4-bignumber"] .s4-whip-wrap {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 140px 140px;
        box-sizing: border-box;
        will-change: transform, filter;
      }
      [data-composition-id="scene4-bignumber"] .s4-preamble {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-weight: 600;
        font-size: 36px;
        letter-spacing: 0.18em;
        color: #E10E1F;
        display: inline-flex;
        align-items: baseline;
        min-height: 44px;
      }
      [data-composition-id="scene4-bignumber"] .s4-strip-caret {
        color: #FAF7F5;
        margin-left: 4px;
        font-weight: 700;
      }
      [data-composition-id="scene4-bignumber"] .s4-scan {
        position: absolute;
        top: 32%;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          #E10E1F 35%,
          #FF2A3C 65%,
          transparent 100%
        );
        opacity: 0.85;
        transform: translateX(-100%);
      }
      [data-composition-id="scene4-bignumber"] .s4-six {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 700;
        font-size: 520px;
        line-height: 0.82;
        color: #FAF7F5;
        text-shadow:
          0 0 60px rgba(225, 14, 31, 0.7),
          0 0 20px rgba(225, 14, 31, 0.45),
          0 8px 0 #070409,
          0 14px 44px rgba(0, 0, 0, 0.7);
        opacity: 0;
        transform: scale(0.35) rotate(-8deg);
      }
      [data-composition-id="scene4-bignumber"] .s4-pill {
        padding: 16px 34px;
        border: 1.5px solid #E10E1F;
        border-radius: 999px;
        background: rgba(35, 4, 8, 0.92);
        text-align: center;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.08em;
        color: #FAF7F5;
        opacity: 0;
        transform: translateY(24px);
      }
      [data-composition-id="scene4-bignumber"] .s4-sub {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-weight: 500;
        font-size: 24px;
        color: #A89BA1;
        text-align: center;
        clip-path: inset(0 100% 0 0);
      }
      [data-composition-id="scene4-bignumber"] .s4-sub-emph {
        color: #E10E1F;
        font-weight: 700;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="scene4-bignumber"] ';
        const DUR = 4;
        const stripText = document.querySelector(scope + "#s4-strip-text");
        const stripFull = "BUT ACTUALLY…";

        // Entry whip
        gsap.set(scope + ".s4-whip-wrap", {
          y: 80, filter: "blur(20px)", opacity: 0.35,
        });
        tl.to(
          scope + ".s4-whip-wrap",
          { y: 0, filter: "blur(0px)", opacity: 1, duration: 0.55, ease: "power3.out" },
          0,
        );

        // Type-on preamble
        for (let i = 1; i <= stripFull.length; i++) {
          tl.call(
            function (n) {
              if (stripText) stripText.textContent = stripFull.slice(0, n);
            },
            [i],
            0.05 + i * 0.04,
          );
        }

        // Scan line sweep
        tl.fromTo(
          scope + "#s4-scan",
          { x: "-100%" },
          { x: "100%", duration: 0.7, ease: "power2.inOut" },
          0.05,
        );

        // Caret blink during preamble hold
        tl.to(
          scope + "#s4-strip-caret",
          { opacity: 0, duration: 0.22, ease: "steps(1)", repeat: 2, yoyo: true },
          0.15,
        );
        tl.to(scope + "#s4-strip-caret", { opacity: 0, duration: 0.05 }, 0.7);

        // Big 6 reveal
        tl.to(
          scope + "#s4-six",
          { opacity: 1, scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2.0)" },
          0.72,
        );

        // Tremor
        tl.to(
          scope + "#s4-six",
          { x: 10, duration: 0.05, yoyo: true, repeat: 3, ease: "power1.inOut" },
          1.16,
        );

        // Pill lands
        tl.to(
          scope + "#s4-pill",
          { opacity: 1, y: 0, duration: 0.36, ease: "back.out(1.9)" },
          1.22,
        );

        // Sub-line reveal
        tl.to(
          scope + "#s4-sub",
          { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power3.out" },
          1.6,
        );

        // Closing pulse on the 6
        tl.to(
          scope + "#s4-six",
          { scale: 1.04, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 1 },
          2.3,
        );

        // Hold pad
        tl.set({}, {}, DUR);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene4-bignumber"] = tl;
      })();
    </script>
  </div>
</template>
