<!--
  PATTERN: cta-supernova (COSMIC)  ·  face: BOTTOM
  KEYWORDS: word slam + tremor · solar burst · shockwave ring · pill glow + arrow nudge
  DÙNG KHI: kêu gọi hành động cuối (theo dõi / xem tiếp / comment). Ngắn 2.5-5s.
  CUSTOMIZE: headline 2-3 từ (1 từ accent đỏ) + text pill. Để CTA hiện SỚM ~1s để người xem kịp thấy hiệu ứng.
-->
<template id="cta-supernova-template">
  <div data-composition-id="cta-supernova" data-start="0" data-width="1080" data-height="1920" data-duration="3.2">
    <div class="cta-wrap">
      <div class="cta-burst" id="ctaburst"></div>
      <div class="cta-ring" id="ctaring"></div>
      <div class="cta-head" id="ctahead"><span class="w">XEM</span> <span class="w accent">NGAY</span></div>
      <div class="cta-pill" id="ctapill"><svg viewBox="0 0 24 24" fill="none" stroke="#FAF7F5" stroke-width="2.5"><polygon points="6 4 20 12 6 20 6 4"/></svg><span>nhãn hành động</span></div>
    </div>
    <style>
      [data-composition-id="cta-supernova"]{position:absolute;inset:0;font-family:"Plus Jakarta Sans",sans-serif}
      [data-composition-id="cta-supernova"] .cta-wrap{position:absolute;inset:0}
      [data-composition-id="cta-supernova"] .cta-burst{position:absolute;top:560px;left:50%;width:960px;height:960px;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle,rgba(225,14,31,0.55),rgba(225,14,31,0.18) 30%,transparent 60%);opacity:0;mix-blend-mode:screen}
      [data-composition-id="cta-supernova"] .cta-ring{position:absolute;top:560px;left:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:2px solid rgba(225,14,31,0.6);opacity:0}
      [data-composition-id="cta-supernova"] .cta-head{position:absolute;top:440px;left:0;right:0;text-align:center;font-family:"Be Vietnam Pro",sans-serif;font-weight:800;font-size:130px;letter-spacing:-0.03em;line-height:0.96;text-shadow:0 4px 0 #070409,0 0 48px rgba(225,14,31,0.4)}
      [data-composition-id="cta-supernova"] .cta-head .w{display:inline-block;opacity:0;transform:translateY(-90px) rotate(-6deg);filter:blur(14px)}
      [data-composition-id="cta-supernova"] .cta-head .accent{color:#E10E1F}
      @keyframes ctanudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
      [data-composition-id="cta-supernova"] .cta-pill{position:absolute;top:640px;left:50%;transform:translateX(-50%) scale(0.6);display:inline-flex;align-items:center;gap:16px;padding:26px 50px;border-radius:999px;background:#E10E1F;font-family:"Be Vietnam Pro",sans-serif;font-weight:700;font-size:44px;color:#FAF7F5;box-shadow:0 0 50px rgba(225,14,31,0.6);opacity:0;white-space:nowrap}
      [data-composition-id="cta-supernova"] .cta-pill svg{width:38px;height:38px;animation:ctanudge 1.2s ease-in-out infinite}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function(){
        const tl=gsap.timeline({paused:true});
        const sc='[data-composition-id="cta-supernova"] ';
        tl.to(sc+'.cta-head .w',{opacity:1,y:0,rotation:0,filter:'blur(0px)',duration:0.36,ease:'back.out(1.7)',stagger:0.10},0.1)
          .to(sc+'.cta-head .w',{x:5,duration:0.04,yoyo:true,repeat:3,ease:'power1.inOut'},0.55)
          .to(sc+'#ctaburst',{opacity:1,scale:1,duration:0.32,ease:'power3.out'},0.35)
          .to(sc+'#ctaburst',{opacity:0,duration:0.5,ease:'power2.in'},0.7)
          .fromTo(sc+'#ctaring',{scale:0.3,opacity:0.9},{scale:2.4,opacity:0,duration:0.7,ease:'power2.out'},0.4)
          .to(sc+'#ctapill',{opacity:1,scale:1,duration:0.4,ease:'back.out(1.9)'},0.6);
        tl.set({},{},3.2);
        window.__timelines=window.__timelines||{};
        window.__timelines["cta-supernova"]=tl;
      })();
    </script>
  </div>
</template>
