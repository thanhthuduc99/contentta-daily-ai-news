<!--
  PATTERN: editorial-headline (EDITORIAL)  ·  face: BOTTOM
  KEYWORDS: dấu nháy đôi oversized · Playfair italic headline 2 dòng (dòng 2 accent) · hairline draw · sub
  DÙNG KHI: chốt 1 ý / trích quan điểm ("Góc nhìn thật của mình"). Sang trọng, có không gian thở.
  CUSTOMIZE: 2 dòng headline + sub + tag góc phải. FONT: Playfair Display + JetBrains Mono + Be Vietnam Pro.
-->
<template id="editorial-headline-template">
  <div data-composition-id="editorial-headline" data-start="0" data-width="1080" data-height="1920" data-duration="5.5">
    <div class="eh-wrap">
      <div class="eh-qmark" id="ehqm">&ldquo;</div>
      <div class="eh-tag" id="ehtag">NHÃN GÓC PHẢI</div>
      <div class="eh-head"><span class="line" id="ehl1">Dòng tiêu đề</span><span class="line" id="ehl2"><span class="a">nhấn mạnh</span></span></div>
      <div class="eh-div" id="ehdiv"></div>
      <div class="eh-sub" id="ehsub">phụ đề một dòng</div>
    </div>
    <style>
      [data-composition-id="editorial-headline"]{position:absolute;inset:0;font-family:"Be Vietnam Pro",sans-serif}
      [data-composition-id="editorial-headline"] .eh-wrap{position:absolute;inset:0;will-change:transform,filter}
      [data-composition-id="editorial-headline"] .eh-qmark{position:absolute;top:230px;left:90px;font-family:"Playfair Display",serif;font-style:italic;font-weight:700;font-size:260px;line-height:0.7;color:#E10E1F;opacity:0;transform:scale(0.6) rotate(-6deg)}
      [data-composition-id="editorial-headline"] .eh-tag{position:absolute;top:300px;right:110px;font-family:"JetBrains Mono",monospace;font-size:20px;letter-spacing:0.32em;color:#A89BA1;text-transform:uppercase;opacity:0}
      [data-composition-id="editorial-headline"] .eh-head{position:absolute;top:470px;left:110px;right:110px;font-family:"Playfair Display",serif;font-style:italic;font-weight:700;font-size:110px;line-height:1.06;letter-spacing:-0.015em;color:#FAF7F5}
      [data-composition-id="editorial-headline"] .eh-head .line{display:block;opacity:0;transform:translateY(28px);clip-path:inset(0 0 100% 0)}
      [data-composition-id="editorial-headline"] .eh-head .a{color:#E10E1F}
      [data-composition-id="editorial-headline"] .eh-div{position:absolute;top:760px;left:110px;width:340px;height:1px;background:#FAF7F5;transform-origin:left;transform:scaleX(0)}
      [data-composition-id="editorial-headline"] .eh-sub{position:absolute;top:800px;left:110px;right:110px;font-weight:500;font-size:32px;color:#A89BA1;opacity:0}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function(){
        const tl=gsap.timeline({paused:true});
        const sc='[data-composition-id="editorial-headline"] ';
        tl.to(sc+'#ehqm',{opacity:1,scale:1,rotation:0,duration:0.5,ease:'back.out(1.5)'},0.1)
          .to(sc+'#ehtag',{opacity:1,duration:0.3,ease:'power2.out'},0.3)
          .to(sc+'#ehl1',{opacity:1,y:0,clipPath:'inset(0 0 0% 0)',duration:0.4,ease:'power3.out'},0.5)
          .to(sc+'#ehl2',{opacity:1,y:0,clipPath:'inset(0 0 0% 0)',duration:0.4,ease:'power3.out'},0.7)
          .to(sc+'#ehdiv',{scaleX:1,duration:0.4,ease:'power3.out'},0.95)
          .to(sc+'#ehsub',{opacity:1,duration:0.32,ease:'power2.out'},1.1);
        tl.to(sc+'.eh-wrap',{y:-90,filter:'blur(18px)',opacity:0,duration:0.30,ease:'power2.in'},5.2);
        tl.set({},{},5.5);
        window.__timelines=window.__timelines||{};
        window.__timelines["editorial-headline"]=tl;
      })();
    </script>
  </div>
</template>
