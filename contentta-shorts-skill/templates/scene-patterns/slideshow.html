<!--
  PATTERN: slideshow (COSMIC)  ·  face: BOTTOM (graphics nửa trên)
  KEYWORDS: cosmic orbital bg · 3 slides đổi mỗi 3-5s · progress dots · whip in/out · chip đổi theo slide
  DÙNG KHI: đoạn intro/liệt kê mà 1 câu nói trải qua nhiều ý — mỗi ý 1 slide (vd "tính năng mới / cập nhật / sản phẩm").
  CUSTOMIZE: sửa text 3 slide (.s1-head + chip + sub), số slide, mốc ins[]/outs[] khớp lời. data-duration = tổng.
  LƯU Ý typography: dòng trên dấu NẶNG + dòng dưới dấu SẮC (Ậ/Ớ) → tăng line-height slide đó (~1.34), xem #slN .s1-head.
-->
<template id="slideshow-template">
  <div data-composition-id="slideshow" data-start="0" data-width="1080" data-height="1920" data-duration="10.5">
    <div class="s1-orbit o1"></div><div class="s1-orbit o2"></div><div class="s1-orbit o3"></div>
    <div class="slide" id="sl1"><div class="s1-chip"><span class="dot"></span><span>NHÃN 1</span></div><div class="s1-head">DÒNG MỘT<br/><span class="accent">NHẤN MẠNH</span></div><div class="s1-sub">phụ đề slide 1</div></div>
    <div class="slide" id="sl2"><div class="s1-chip"><span class="dot"></span><span>NHÃN 2</span></div><div class="s1-head">DÒNG HAI<br/><span class="accent">NHẤN MẠNH</span></div><div class="s1-sub">phụ đề slide 2</div></div>
    <div class="slide" id="sl3"><div class="s1-chip"><span class="dot"></span><span>NHÃN 3</span></div><div class="s1-head">DÒNG BA<br/><span class="accent">NHẤN MẠNH</span></div><div class="s1-sub">phụ đề slide 3</div></div>
    <div class="s1-dots"><span class="pd" id="pd1"></span><span class="pd" id="pd2"></span><span class="pd" id="pd3"></span></div>
    <style>
      [data-composition-id="slideshow"]{position:absolute;inset:0;font-family:"Plus Jakarta Sans",sans-serif}
      @keyframes s1spin{to{transform:rotate(360deg)}} @keyframes s1spinR{to{transform:rotate(-360deg)}}
      [data-composition-id="slideshow"] .s1-orbit{position:absolute;top:520px;left:50%;border-radius:50%;transform-origin:center}
      [data-composition-id="slideshow"] .o1{width:920px;height:920px;margin:-460px 0 0 -460px;border:1.5px solid rgba(225,14,31,0.34);animation:s1spin 26s linear infinite}
      [data-composition-id="slideshow"] .o2{width:660px;height:660px;margin:-330px 0 0 -330px;border:1px solid rgba(250,247,245,0.12);animation:s1spinR 18s linear infinite}
      [data-composition-id="slideshow"] .o3{width:420px;height:420px;margin:-210px 0 0 -210px;border:1.5px solid rgba(225,14,31,0.24);animation:s1spin 12s linear infinite}
      [data-composition-id="slideshow"] .slide{position:absolute;inset:0;opacity:0;will-change:transform,opacity,filter}
      [data-composition-id="slideshow"] .s1-chip{position:absolute;top:280px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:10px;padding:9px 22px;border:1.5px solid rgba(225,14,31,0.6);background:rgba(7,4,9,0.7);border-radius:999px;font-weight:600;font-size:22px;letter-spacing:0.22em;color:#FAF7F5;white-space:nowrap}
      [data-composition-id="slideshow"] .s1-chip .dot{width:10px;height:10px;border-radius:50%;background:#E10E1F;box-shadow:0 0 12px rgba(225,14,31,0.9)}
      [data-composition-id="slideshow"] .s1-head{position:absolute;top:390px;left:0;right:0;text-align:center;font-family:"Be Vietnam Pro",sans-serif;font-weight:800;font-size:116px;letter-spacing:-0.03em;line-height:1.18;text-shadow:0 4px 0 #070409,0 0 48px rgba(225,14,31,0.35)}
      [data-composition-id="slideshow"] .s1-head .accent{color:#E10E1F}
      /* Slide có va dấu nặng/sắc thì giãn riêng, vd: #sl3 .s1-head{line-height:1.36} */
      [data-composition-id="slideshow"] .s1-sub{position:absolute;top:780px;left:0;right:0;text-align:center;font-weight:600;font-size:32px;letter-spacing:0.02em;color:#A89BA1}
      [data-composition-id="slideshow"] .s1-dots{position:absolute;top:900px;left:50%;transform:translateX(-50%);display:flex;gap:14px}
      [data-composition-id="slideshow"] .pd{width:40px;height:5px;border-radius:3px;background:rgba(250,247,245,0.22)}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function(){
        const tl=gsap.timeline({paused:true});
        const sc='[data-composition-id="slideshow"] ';
        const slides=['#sl1','#sl2','#sl3'], dots=['#pd1','#pd2','#pd3'];
        const ins=[0.2,3.7,7.2], outs=[3.4,6.9,10.2];   // khớp lời từng slide
        slides.forEach(function(s,i){
          tl.fromTo(sc+s,{opacity:0,y:60,filter:'blur(14px)'},{opacity:1,y:0,filter:'blur(0px)',duration:0.45,ease:'power3.out'},ins[i]);
          tl.to(sc+dots[i],{backgroundColor:'#E10E1F',width:56,duration:0.3,ease:'power2.out'},ins[i]);
          if(i<slides.length-1){
            tl.to(sc+s,{opacity:0,y:-70,filter:'blur(16px)',duration:0.3,ease:'power2.in'},outs[i]);
            tl.to(sc+dots[i],{backgroundColor:'rgba(250,247,245,0.22)',width:40,duration:0.3,ease:'power2.out'},outs[i]);
          }
        });
        tl.to(sc+'#sl3',{opacity:0,y:-90,filter:'blur(20px)',duration:0.32,ease:'power2.in'},outs[2]);
        tl.set({},{},10.5);
        window.__timelines=window.__timelines||{};
        window.__timelines["slideshow"]=tl;
      })();
    </script>
  </div>
</template>
