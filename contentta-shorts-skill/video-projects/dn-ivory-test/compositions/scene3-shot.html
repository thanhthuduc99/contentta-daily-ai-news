<template id="s3-shot-template">
  <div data-composition-id="s3-shot" data-start="0" data-width="1080" data-height="1920" data-duration="9.48">
    <link rel="stylesheet" href="assets/fonts/brand-fonts.css" />
    <link rel="stylesheet" href="assets/base-vertical.css" />

  <div class="content">
    <div class="head">
      <div class="eyebrow" style="--dot: var(--sky)">Nhìn thẳng vào repo</div>
      <h2 class="headline sm">Chỗ gom plugin <span class="accent">cộng đồng</span> viết</h2>
    </div>

    <div class="shot-wrap">
      <div class="shot">
        <div class="shot-bar"><i></i><i></i><i></i></div>
        <img src="assets/media/shot-viewport.png" alt="">
      </div>
      <div class="callout c1">Claude Code và Claude Cowork</div>
      <div class="callout c2">Cần gì thì vào đây tìm trước</div>
    </div>

    <div class="stat tabnum">822 <small>sao · 122 fork · Apache-2.0</small></div>
  </div>
    <style>
[data-composition-id="s3-shot"] .content { align-items: center; justify-content: center; gap: 44px; }
[data-composition-id="s3-shot"] .head { display: flex; flex-direction: column; align-items: center; gap: 26px; }
[data-composition-id="s3-shot"] .eyebrow { opacity: 0; }
[data-composition-id="s3-shot"] .headline { text-align: center; opacity: 0; }
[data-composition-id="s3-shot"] /* Ảnh chụp nguyên khung 16:9 (2560x1440), [data-composition-id="s3-shot"] thu nhỏ chứ không cắt.
     936px là hết bề ngang content, [data-composition-id="s3-shot"] ảnh cao 527px. */
  .shot-wrap { position: relative; width: 936px; opacity: 0; }
[data-composition-id="s3-shot"] .shot { position: relative; }
[data-composition-id="s3-shot"] .shot img { width: 100%; }
[data-composition-id="s3-shot"] /* Ảnh thật nền trắng trên nền kem: viền trong mảnh giữ cho hai sắc trắng không dính vào nhau */
  .shot::after {
    content: ''; position: absolute; inset: 0; border-radius: 20px; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(23,19,13,.10);
  }
[data-composition-id="s3-shot"] /* Ảnh 16:9 thu nhỏ thì chữ bên trong nhỏ, [data-composition-id="s3-shot"] nên callout gánh phần thông tin.
     Đặt straddle mép trên/dưới, [data-composition-id="s3-shot"] lệch trái/phải, [data-composition-id="s3-shot"] không đè vào giữa ảnh. */
  .callout { position: absolute; opacity: 0; white-space: nowrap; font-size: 29px; padding: 17px 28px; }
[data-composition-id="s3-shot"] .callout.c1 { top: -28px; left: 40px; }
[data-composition-id="s3-shot"] .callout.c2 { bottom: -28px; right: 40px; }
[data-composition-id="s3-shot"] .stat {
    display: inline-flex; align-items: baseline; gap: 16px; opacity: 0;
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;
    font-size: 66px; letter-spacing: -.03em; color: var(--ink);
  }
[data-composition-id="s3-shot"] .stat small { font-family: 'Be Vietnam Pro', sans-serif; font-weight: 500; font-size: 31px; color: var(--ink-soft); letter-spacing: 0; }
    </style>
    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
  const DUR = 9.48;
  const tl = gsap.timeline({ paused: true });
  const EASE = 'power3.out';

  tl.fromTo('[data-composition-id="s3-shot"] .eyebrow',    { opacity: 0, y: 18 },             { opacity: 1, y: 0, duration: .4, ease: EASE }, 0)
    .fromTo('[data-composition-id="s3-shot"] .headline',   { opacity: 0, y: 26 },             { opacity: 1, y: 0, duration: .5, ease: EASE }, .14)
    .fromTo('[data-composition-id="s3-shot"] .shot-wrap',  { opacity: 0, y: 44, scale: .96 }, { opacity: 1, y: 0, scale: 1, duration: .7, ease: EASE }, .44)
    .fromTo('[data-composition-id="s3-shot"] .callout.c1', { opacity: 0, y: 14, scale: .92 }, { opacity: 1, y: 0, scale: 1, duration: .42, ease: 'back.out(1.6)' }, 1.16)
    .fromTo('[data-composition-id="s3-shot"] .callout.c2', { opacity: 0, y: -14, scale: .92 },{ opacity: 1, y: 0, scale: 1, duration: .42, ease: 'back.out(1.6)' }, 1.62)
    .fromTo('[data-composition-id="s3-shot"] .stat',       { opacity: 0, y: 22 },             { opacity: 1, y: 0, duration: .45, ease: EASE }, 2.20);

  // Parallax nhẹ — DS: parallax is subtle
  tl.fromTo('[data-composition-id="s3-shot"] .shot-wrap', { yPercent: 0 }, { yPercent: -1.2, duration: DUR - 1.2, ease: 'none' }, 1.2);

  tl.set({}, {}, DUR);

  window.__timelines = window.__timelines || {};
  window.__timelines["s3-shot"] = tl;
      })();
    </script>
  </div>
</template>
