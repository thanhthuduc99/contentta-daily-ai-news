<template id="ambient-bg-template">
  <div
    data-composition-id="ambient-bg"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="87.91"
  >
    <div class="amb-root">
      <div class="amb-base"></div>
      <div class="amb-nebula"></div>
      <div class="amb-grid" id="amb-grid"></div>

      <div class="amb-particles">
        <div class="amb-dot" style="left: 12%; top: 18%;"></div>
        <div class="amb-dot" style="left: 82%; top: 9%;"></div>
        <div class="amb-dot" style="left: 40%; top: 32%;"></div>
        <div class="amb-dot" style="left: 91%; top: 52%;"></div>
        <div class="amb-dot" style="left: 8%; top: 68%;"></div>
        <div class="amb-dot" style="left: 62%; top: 78%;"></div>
        <div class="amb-dot" style="left: 24%; top: 88%;"></div>
        <div class="amb-dot" style="left: 74%; top: 28%;"></div>
      </div>

      <div class="amb-vignette"></div>
    </div>

    <style>
      [data-composition-id="ambient-bg"] {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      [data-composition-id="ambient-bg"] .amb-root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #070409;
      }
      [data-composition-id="ambient-bg"] .amb-base {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse 70% 50% at 50% 30%,
            #1a0a14 0%,
            #0e060c 50%,
            #070409 85%,
            #050307 100%
          );
      }
      [data-composition-id="ambient-bg"] .amb-nebula {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse 50% 40% at 22% 18%,
            rgba(90, 4, 16, 0.55) 0%,
            rgba(90, 4, 16, 0.15) 40%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 40% 30% at 85% 88%,
            rgba(225, 14, 31, 0.18) 0%,
            rgba(176, 9, 27, 0.06) 35%,
            transparent 70%
          );
        mix-blend-mode: screen;
        opacity: 0.85;
      }
      [data-composition-id="ambient-bg"] .amb-grid {
        position: absolute;
        inset: -40px;
        background-image:
          linear-gradient(rgba(250, 247, 245, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(250, 247, 245, 0.05) 1px, transparent 1px);
        background-size: 80px 80px;
        opacity: 0.7;
        will-change: transform;
      }
      [data-composition-id="ambient-bg"] .amb-particles {
        position: absolute;
        inset: 0;
      }
      [data-composition-id="ambient-bg"] .amb-dot {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #E10E1F;
        box-shadow: 0 0 14px rgba(225, 14, 31, 0.65);
        opacity: 0.5;
        will-change: transform, opacity;
      }
      [data-composition-id="ambient-bg"] .amb-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 100% 80% at 50% 50%,
          transparent 50%,
          rgba(5, 3, 7, 0.5) 85%,
          rgba(5, 3, 7, 0.85) 100%
        );
      }
    </style>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="ambient-bg"] ';
        const TOTAL = 87.91;

        const GRID_CYCLE = 12;
        tl.to(
          scope + "#amb-grid",
          {
            x: -80,
            y: -80,
            duration: GRID_CYCLE,
            ease: "none",
            repeat: Math.max(Math.floor(TOTAL / GRID_CYCLE) - 1, 0),
          },
          0,
        );

        const dots = document.querySelectorAll(scope + ".amb-dot");
        dots.forEach(function (dot, i) {
          const dx = 40 + (i % 3) * 14;
          const dy = 30 + ((i + 1) % 3) * 12;
          const dur = 8 + (i % 4) * 1.2;
          const cycles = Math.max(Math.floor(TOTAL / (dur * 2)), 1);
          const repeatCount = cycles * 2 - 1;
          tl.to(
            dot,
            {
              x: dx,
              y: -dy,
              duration: dur,
              ease: "sine.inOut",
              yoyo: true,
              repeat: repeatCount,
            },
            0,
          );
          const opDur = dur * 0.6;
          const opCycles = Math.max(Math.floor(TOTAL / (opDur * 2)), 1);
          tl.to(
            dot,
            {
              opacity: 0.85,
              duration: opDur,
              ease: "sine.inOut",
              yoyo: true,
              repeat: opCycles * 2 - 1,
            },
            0,
          );
        });

        tl.set({}, {}, TOTAL);

        window.__timelines = window.__timelines || {};
        window.__timelines["ambient-bg"] = tl;
      })();
    </script>
  </div>
</template>
